spring.application.name=notification-service
server.port=${PORT:8080}
spring.config.import=optional:file:.env[.properties]
brevo.base-url=${BREVO_BASE_URL:https://api.brevo.com}
brevo.api-key=${brevo.local.api-key:${BREVO_API_KEY:}}
brevo.from-address=${brevo.local.from.address:${BREVO_FROM_ADDRESS:}}
brevo.from-name=${brevo.local.from.name:${BREVO_FROM_NAME:Notification Service}}
brevo.connect-timeout=${BREVO_CONNECT_TIMEOUT:2s}
brevo.read-timeout=${BREVO_READ_TIMEOUT:5s}
brevo.retry-max-attempts=${BREVO_RETRY_MAX_ATTEMPTS:3}
brevo.retry-initial-delay=${BREVO_RETRY_INITIAL_DELAY:500ms}
brevo.retry-multiplier=${BREVO_RETRY_MULTIPLIER:2.0}
brevo.circuit-failure-threshold=${BREVO_CIRCUIT_FAILURE_THRESHOLD:50}
brevo.circuit-sliding-window-size=${BREVO_CIRCUIT_WINDOW_SIZE:10}
brevo.circuit-minimum-calls=${BREVO_CIRCUIT_MINIMUM_CALLS:5}
brevo.circuit-open-duration=${BREVO_CIRCUIT_OPEN_DURATION:30s}
