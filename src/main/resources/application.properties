spring.application.name=notification-service
server.port=${PORT:8080}
spring.config.import=optional:file:.env[.properties]
# =========================
# BREVO
# =========================
brevo.base-url=${BREVO_BASE_URL:https://api.brevo.com}
brevo.api-key=${brevo.local.api-key:${BREVO_API_KEY:}}
brevo.from-address=${brevo.local.from.address:${BREVO_FROM_ADDRESS:}}
brevo.from-name=${brevo.local.from.name:${BREVO_FROM_NAME:Notification Service}}
brevo.connect-timeout=${BREVO_CONNECT_TIMEOUT:2s}
brevo.read-timeout=${BREVO_READ_TIMEOUT:5s}
brevo.retry-max-attempts=${BREVO_RETRY_MAX_ATTEMPTS:3}
brevo.retry-initial-delay=${BREVO_RETRY_INITIAL_DELAY:500ms}
brevo.retry-multiplier=${BREVO_RETRY_MULTIPLIER:2.0}
brevo.circuit-failure-threshold=${BREVO_CIRCUIT_FAILURE_THRESHOLD:50}
brevo.circuit-sliding-window-size=${BREVO_CIRCUIT_WINDOW_SIZE:10}
brevo.circuit-minimum-calls=${BREVO_CIRCUIT_MINIMUM_CALLS:5}
brevo.circuit-open-duration=${BREVO_CIRCUIT_OPEN_DURATION:30s}
# =========================
# RABBITMQ / CLOUDAMQP
# =========================
spring.rabbitmq.addresses=${RABBITMQ_URL}
# Cola que escucha notification-service
rabbitmq.notification.queue=${RABBITMQ_NOTIFICATION_QUEUE:notification.events.queue}
rabbitmq.domain.exchange=${RABBITMQ_DOMAIN_EXCHANGE:domain.events}
rabbitmq.notification.routing-key=${RABBITMQ_NOTIFICATION_ROUTING_KEY:user.#}
# =========================
# LISTENER
# =========================
# Evita consumir muchos mensajes simultáneamente en este laboratorio
spring.rabbitmq.listener.simple.concurrency=${RABBITMQ_CONCURRENCY:1}
spring.rabbitmq.listener.simple.max-concurrency=${RABBITMQ_MAX_CONCURRENCY:3}
# ACK automático después de procesamiento satisfactorio
spring.rabbitmq.listener.simple.acknowledge-mode=${RABBITMQ_ACK_MODE:auto}
spring.rabbitmq.listener.simple.default-requeue-rejected=${RABBITMQ_REQUEUE_REJECTED:false}
# =========================
# LOGGING
# =========================
logging.level.org.springframework.amqp=${RABBITMQ_LOG_LEVEL:INFO}
logging.level.org.springframework.rabbit=${RABBITMQ_LOG_LEVEL:INFO}
