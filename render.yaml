services:
  - type: web
    name: notification-service
    runtime: docker
    plan: free
    healthCheckPath: /health
    envVars:
      # BREVO
      - key: BREVO_API_KEY
        sync: false
      - key: BREVO_FROM_ADDRESS
        sync: false
      - key: BREVO_FROM_NAME
        value: "Notification Service"
      - key: BREVO_BASE_URL
        value: "https://api.brevo.com"
      - key: BREVO_CONNECT_TIMEOUT
        value: "2s"
      - key: BREVO_READ_TIMEOUT
        value: "5s"
      - key: BREVO_RETRY_MAX_ATTEMPTS
        value: "3"
      - key: BREVO_RETRY_INITIAL_DELAY
        value: "500ms"
      - key: BREVO_RETRY_MULTIPLIER
        value: "2.0"
      - key: BREVO_CIRCUIT_FAILURE_THRESHOLD
        value: "50"
      - key: BREVO_CIRCUIT_WINDOW_SIZE
        value: "10"
      - key: BREVO_CIRCUIT_MINIMUM_CALLS
        value: "5"
      - key: BREVO_CIRCUIT_OPEN_DURATION
        value: "30s"
      # KAFKA (Aiven)
      - key: KAFKA_BOOTSTRAP_SERVERS
        sync: false
      - key: KAFKA_USERNAME
        sync: false
      - key: KAFKA_PASSWORD
        sync: false
      - key: KAFKA_CA_CERT
        sync: false
      - key: KAFKA_SECURITY_PROTOCOL
        value: "SASL_SSL"
      - key: KAFKA_SASL_MECHANISM
        value: "SCRAM-SHA-256"
      - key: KAFKA_GROUP_ID
        value: "notification-service"
      - key: KAFKA_TOPIC_USER_EVENTS
        value: "user-events"
      - key: KAFKA_TOPIC_ACCOUNT_EVENTS
        value: "account-events"
